[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedi-autobench"
version = "0.1.1"
description = "Autobench instrumentation for Kedi"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
# PyPI shows the Author field in full but only the first address of Author-email, so names and
# addresses are separate entries.
authors = [
    {name = "Mert Sırakaya"},
    {name = "Doğukan Yiğit Polat"},
    {email = "mert@kedi-lang.org"},
    {email = "yigit@neurograph.net"},
]
dependencies = [
    "autobench>=0.6,<0.7",
    "kedi>=0.1.1,<0.2",
]

[project.urls]
Repository = "https://github.com/kedi-lang/kedi-autobench"
Issues = "https://github.com/kedi-lang/kedi-autobench/issues"

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai==2.66.0"]

[project.scripts]
kedi-autobench-terminal-bench = "kedi_autobench.terminal_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kedi_autobench"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2,<1.41",
    "pre-commit>=4.6",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "pytest-cov>=7.1",
    "ruff>=0.15.6",
    "ty>=0.0.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/kedi_autobench"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]

[[tool.basedpyright.executionEnvironments]]
root = "."
extraPaths = ["src"]

[tool.ty.environment]
python-version = "3.11"
